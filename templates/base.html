<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Pago Confirmado{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f8fafc; color: #334155; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 10px; }
        
        /* Simulador físico de Smartphone para la sustentación */
        .phone-container { width: 375px; height: 760px; background: white; border: 12px solid #1e293b; border-radius: 40px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .phone-bar { height: 24px; background: #ffffff; padding: 0 24px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 600; color: #1e293b; flex-shrink: 0; }
        .phone-screen { flex: 1; display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden; background-color: #f1f5f9; padding-bottom: 60px; position: relative; }
        
        /* Barra de navegación inferior idéntica al wireframe */
        .bottom-nav { position: absolute; bottom: 0; left: 0; width: 100%; height: 60px; background: white; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #94a3b8; font-size: 10px; font-weight: 700; cursor: pointer; background: none; border: none; }
        .nav-item.active { color: #2563eb; }
        .nav-icon { font-size: 18px; }

        /* Estilos de componentes compartidos */
        .header-app { background: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; }
        .header-title { font-size: 16px; font-weight: 800; color: #1e293b; display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body>

    <div class="phone-container">
        <!-- Barra de estado superior del móvil -->
        <div class="phone-bar">
            <span>9:41</span>
            <span style="letter-spacing: 1px;">📶 🔋</span>
        </div>

        <!-- Pantalla de la aplicación -->
        <div class="phone-screen">
            {% block content %}{% endblock %}
        </div>

        <!-- Menú inferior físico enlazado de forma modular -->
        <nav class="bottom-nav">
            <a href="/" class="nav-item {% if active_page == 'inicio' %}active{% endif %}">
                <span class="nav-icon">🏠</span>
                <span>Inicio</span>
            </a>
            <a href="/cobrar" class="nav-item {% if active_page == 'cobrar' %}active{% endif %}">
                <span class="nav-icon">🔲</span>
                <span>Cobros</span>
            </a>
            <a href="/historial" class="nav-item {% if active_page == 'historial' %}active{% endif %}">
                <span class="nav-icon">📊</span>
                <span>Ventas</span>
            </a>
            <a href="/perfil" class="nav-item {% if active_page == 'perfil' %}active{% endif %}">
                <span class="nav-icon">👤</span>
                <span>Perfil</span>
            </a>
        </nav>

    </div>

</body>
</html>
